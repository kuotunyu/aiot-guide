name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push replaces a queued one, but a deploy already running is not cut off.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The same checks as pull requests (quality.yml); deploy waits for them on this exact commit.
  quality:
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # build.py exits non-zero when it reports problems, so a bad build never reaches the upload.
      - run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
