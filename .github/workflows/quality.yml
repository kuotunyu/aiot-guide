name: Quality

# Pull requests run it directly. Pushes to main run it through pages.yml (workflow_call),
# so a deploy only happens after these checks pass on the same commit.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Browser downloads are cached per Playwright version; system libraries (and the CJK font) are installed every run.
      - id: pw
        run: echo "version=$(npx playwright --version | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-webkit
      # A package mirror sometimes stalls (2026-11-24: 20 minutes, then the whole job was cancelled).
      # Each attempt gets 6 minutes; a stalled one is stopped and tried once more, so a stall costs minutes, not the deploy.
      - name: Install browsers and fonts
        timeout-minutes: 14
        run: |
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null
          for i in 1 2; do
            timeout 360 bash -c 'sudo apt-get update && sudo apt-get install -y fonts-noto-cjk && npx playwright install --with-deps chromium webkit' && exit 0
            echo "attempt $i stalled or failed; trying again"
          done
          exit 1
      # CI=true adds the WebKit smoke project (see playwright.config.js).
      - run: npm run check
      - name: Save browser traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
