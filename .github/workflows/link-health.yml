name: External links

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python build.py
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-retries 3 --timeout 30
            --accept 200,202,403,429
            --exclude "kuotunyu.github.io/aiot-guide"
            --exclude "github.com/kuotunyu/aiot-guide"
            "dist/*.html"
          fail: true
